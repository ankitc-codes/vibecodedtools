<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Instagram Keyword Tool — VibecodedTools</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Instagram Keyword Research</h1>
    <p>Enter comma-separated seed keywords (example: "vegan recipes, summer outfits")</p>

    <textarea id="seeds" rows="2" placeholder="seed1, seed2"></textarea>
    <div class="controls">
      <button id="generate">Generate Keywords</button>
      <button id="copy">Copy Top 10</button>
    </div>

    <section id="results">
      <h2>Results</h2>
      <div id="list"></div>
      <h3>Top 10</h3>
      <ol id="top10"></ol>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
